services:
  - type: web
    name: forja-alter-egos
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # JWT_SECRET: o Render gera um valor aleatório seguro sozinho e o
      # mantém entre reinícios (diferente do disco, variáveis de ambiente
      # não são apagadas). Sem isso, no plano grátis (disco efêmero), o
      # servidor geraria um segredo novo a cada reinício e derrubaria o
      # login de todo mundo.
      - key: JWT_SECRET
        generateValue: true
      # ADMIN_PASSWORD: o Render vai pedir pra você digitar esse valor no
      # painel ao criar o serviço (não fica salvo neste arquivo). Pelo
      # mesmo motivo do JWT_SECRET: no plano grátis, sem isso, a senha do
      # admin gerada automaticamente mudaria a cada reinício.
      - key: ADMIN_PASSWORD
        sync: false
      # E-mail de recuperacao de senha (Resend). Sem isso o link so aparece
      # no log do servidor e o jogador nunca recebe o e-mail.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # SITE_URL e opcional no Render: sem ela, o link usa RENDER_EXTERNAL_URL.
      # Defina se usar um dominio proprio (ex: https://forjadealteregos.com.br).
      - key: SITE_URL
        sync: false
